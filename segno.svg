<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Simplified Virtuoso Academy Logo with white foreground and transparent background -->
  
  <!-- Main S-shaped curves using bezier paths -->
  <!-- Upper curve of S -->
  <path d="M 300 150 
           C 200 100, 150 150, 150 250
           C 150 350, 200 400, 350 420
           L 650 480
           C 750 500, 800 550, 800 650
           C 800 750, 700 800, 600 800
           L 400 800" 
        stroke="white" 
        stroke-width="60" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Lower curve of S (mirrored) -->
  <path d="M 724 874
           C 824 924, 874 874, 874 774
           C 874 674, 824 624, 674 604
           L 374 544
           C 274 524, 224 474, 224 374
           C 224 274, 324 224, 424 224
           L 624 224" 
        stroke="white" 
        stroke-width="60" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Crossing diagonal line -->
  <line x1="150" y1="150" 
        x2="874" y2="874" 
        stroke="white" 
        stroke-width="50" 
        stroke-linecap="round"/>
  
  <!-- Side decorative circles -->
  <circle cx="100" cy="300" r="50" fill="white"/>
  <circle cx="924" cy="724" r="50" fill="white"/>
</svg>
